<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Minimalist To-Do List</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" id="themeColorMeta" content="#4f46e5">

  <!-- Apple / iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <!-- Prevent flash of unstyled theme on initial load -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('minimalist_todo_theme');
        const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        // Fallback safely if localStorage is restricted
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="header-title-group">
          <div class="header-badge-row">
            <h1 class="app-title" id="appTitle">Today's Tasks</h1>
            <button 
              type="button" 
              class="btn-today-pill" 
              id="todayQuickBtn" 
              title="Return to today's tasks" 
              aria-label="Return to today" 
              hidden
            >
              <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              <span>Today</span>
            </button>
          </div>
          <p class="current-date" id="currentDate"></p>
        </div>
        
        <div class="header-actions">
          <!-- Calendar Toggle Button -->
          <button 
            type="button" 
            class="header-icon-btn" 
            id="calendarToggleBtn" 
            aria-label="Open calendar" 
            title="Open calendar"
            aria-expanded="false"
          >
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span class="calendar-badge-dot" id="calendarBadgeDot" hidden aria-hidden="true"></span>
          </button>

          <!-- Theme Toggle Button -->
          <button 
            type="button" 
            class="header-icon-btn theme-toggle-btn" 
            id="themeToggle" 
            aria-label="Toggle light and dark theme"
            title="Toggle theme"
          >
            <!-- Sun icon (shown in dark mode to switch to light) -->
            <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon icon (shown in light mode to switch to dark) -->
            <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Expandable Calendar Panel -->
      <div class="calendar-panel" id="calendarPanel" hidden aria-label="Interactive calendar">
        <div class="calendar-header">
          <button type="button" class="calendar-nav-btn" id="prevMonthBtn" aria-label="Previous month" title="Previous month">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="calendar-month-year" id="calendarMonthYear" aria-live="polite">November 2026</div>
          <button type="button" class="calendar-nav-btn" id="nextMonthBtn" aria-label="Next month" title="Next month">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="calendar-weekdays" aria-hidden="true">
          <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
        </div>

        <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Calendar month days"></div>

        <div class="calendar-footer">
          <button type="button" class="btn-text calendar-today-btn" id="calendarGoTodayBtn">Jump to Today</button>
          <button type="button" class="btn-text calendar-close-btn" id="calendarCloseBtn">Close</button>
        </div>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <span class="progress-text" id="progressText">0% completed</span>
      </div>
    </header>

    <form class="task-form" id="taskForm" autocomplete="off">
      <div class="input-group">
        <input 
          type="text" 
          id="taskInput" 
          class="task-input" 
          placeholder="What do you need to do?" 
          aria-label="New task input"
          maxlength="150"
          required
        >
        <!-- Priority toggle button -->
        <button 
          type="button" 
          class="priority-selector-btn priority-med" 
          id="priorityBtn" 
          aria-label="Task priority: Medium. Click to cycle priority" 
          title="Priority: Medium (Click to change)"
        >
          <span class="priority-dot" aria-hidden="true"></span>
          <span class="priority-text" id="priorityText">Med</span>
        </button>
        <button type="submit" class="btn btn-primary" id="addBtn" aria-label="Add task">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="add-btn-text">Add</span>
        </button>
      </div>
    </form>

    <div class="filter-bar">
      <div class="filter-tabs" role="tablist" aria-label="Task filters">
        <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
          All <span class="badge" id="countAll">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="active" role="tab" aria-selected="false">
          Active <span class="badge" id="countActive">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false">
          Completed <span class="badge" id="countCompleted">0</span>
        </button>
      </div>
    </div>

    <main class="tasks-section">
      <ul class="task-list" id="taskList" aria-live="polite"></ul>
      
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon" id="emptyIcon">
          <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
          </svg>
        </div>
        <p class="empty-title" id="emptyTitle">All caught up!</p>
        <p class="empty-subtitle" id="emptySubtitle">Add a new task above to get started.</p>
      </div>
    </main>

    <footer class="app-footer" id="appFooter">
      <span class="items-left" id="itemsLeft">0 items remaining</span>
      <button type="button" class="btn-text" id="clearCompletedBtn" aria-label="Clear all completed tasks">
        Clear completed
      </button>
    </footer>
  </div>

  <!-- Toast notification for Undo -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
